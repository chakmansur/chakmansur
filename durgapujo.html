    <meta name="description"
          content="চকমনসুর বানীশ্রী সংঘের ৫২তম বর্ষের দুর্গোৎসব ২০২৬">

<style>

/* =====================================================
   DURGA PUJO PAGE
===================================================== */

.durga-page{
    background:#fff8f0;
    min-height:100vh;
    padding-bottom:25px;
}


/* =====================================================
   TOP BACK TO HOME
===================================================== */

.home-top{
    text-align:center;
    padding:12px 10px 5px;
}

.home-btn{
    display:inline-block;
    text-decoration:none;
    background:linear-gradient(135deg,#0b6b2f,#15803d);
    color:#fff;
    padding:10px 22px;
    border-radius:25px;
    font-size:14px;
    font-weight:bold;
    box-shadow:0 4px 12px rgba(0,0,0,.18);
}


/* =====================================================
   CSS HEAD
===================================================== */

.durga-head{

    margin:10px;

    padding:22px 12px;

    text-align:center;

    border-radius:18px;

    background:
    linear-gradient(
        135deg,
        #fff3c4,
        #ffe0b2,
        #ffd1dc,
        #e8d7ff
    );

    border:2px solid rgba(255,153,0,.35);

    box-shadow:0 5px 18px rgba(0,0,0,.15);

    position:relative;

    overflow:hidden;
}


.durga-head::before{

    content:"";

    position:absolute;

    top:0;

    left:0;

    width:100%;

    height:5px;

    background:
    linear-gradient(
        90deg,
        #e91e63,
        #ff9800,
        #f44336,
        #9c27b0
    );
}


.durga-head-icon{

    font-size:34px;

    margin-bottom:5px;
}


.durga-head h1{

    margin:0;

    color:#b71c1c;

    font-size:27px;

    font-weight:800;

    text-shadow:
    1px 2px 3px rgba(0,0,0,.15);
}


.durga-head p{

    margin:7px 0 3px;

    color:#6a1b9a;

    font-size:18px;

    font-weight:bold;
}


.durga-head span{

    display:inline-block;

    margin-top:6px;

    padding:6px 14px;

    border-radius:20px;

    background:rgba(255,255,255,.70);

    color:#8a1c1c;

    font-size:13px;

    font-weight:bold;
}


/* =====================================================
   CLUB POSTER
===================================================== */

.poster-section{

    margin:14px 10px;
}


.poster-card{

    background:#fff;

    padding:8px;

    margin-bottom:14px;

    border-radius:16px;

    box-shadow:
    0 5px 16px rgba(0,0,0,.12);

    border:1px solid #f0d9c0;
}


.poster-card img{

    display:block;

    width:100%;

    height:auto;

    object-fit:contain;

    border-radius:11px;
}


/* =====================================================
   ADVERTISEMENT TITLE
===================================================== */

.advertisement-section{

    margin:18px 10px;
}


.section-title{

    text-align:center;

    margin-bottom:12px;
}


.section-title h2{

    display:inline-block;

    margin:0;

    padding:9px 22px;

    border-radius:25px;

    background:
    linear-gradient(
        90deg,
        #fff3cd,
        #ffe0b2,
        #fce4ec
    );

    color:#b71c1c;

    font-size:21px;

    font-weight:800;

    border:2px solid
    rgba(255,152,0,.30);

    box-shadow:
    0 3px 10px rgba(0,0,0,.10);
}


/* =====================================================
   ADVERTISEMENT CARD

   নতুন AD যোগ করতে এই block COPY করবেন
===================================================== */

.advertisement-card{

    background:#fff;

    padding:8px;

    margin-bottom:14px;

    border-radius:16px;

    box-shadow:
    0 5px 16px rgba(0,0,0,.12);

    border:1px solid #ead9c5;
}


.advertisement-card img{

    display:block;

    width:100%;

    height:auto;

    object-fit:contain;

    border-radius:11px;
}


/* =====================================================
   PUJA SECTION
===================================================== */

.puja-section{

    margin:18px 10px;
}


.puja-card{

    background:#fff;

    padding:10px;

    margin-bottom:20px;

    border-radius:18px;

    box-shadow:
    0 5px 18px rgba(0,0,0,.12);

    border:1px solid #ead9c5;
}


.puja-card h2{

    text-align:center;

    margin:0 0 12px;

    padding:10px 8px;

    border-radius:14px;

    background:
    linear-gradient(
        90deg,
        #fff3cd,
        #ffe0b2,
        #fce4ec,
        #ede7f6
    );

    border:2px solid
    rgba(183,28,28,.25);

    color:#b71c1c;

    font-size:22px;

    font-weight:800;

    letter-spacing:.5px;

    text-shadow:
    1px 2px 3px rgba(0,0,0,.15);
}


.puja-card img{

    display:block;

    width:100%;

    height:auto;

    object-fit:contain;

    border-radius:12px;
}


/* =====================================================
   BOTTOM HOME BUTTON
===================================================== */

.home-bottom{

    text-align:center;

    padding:5px 10px 20px;
}


/* =====================================================
   DEVELOPER MAINTENANCE
===================================================== */

.developer{

    text-align:center;

    background:#0b6b2f;

    color:#fff;

    padding:15px 10px;

    margin-top:5px;

    font-size:12px;

    line-height:1.6;
}


.developer strong{

    font-size:13px;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .durga-head h1{
        font-size:25px;
    }

    .durga-head p{
        font-size:16px;
    }

    .puja-card h2{
        font-size:20px;
    }

}

</style>

</head>
