<!DOCTYPE html>
<html lang="bn">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>📅 বাংলা পঞ্জিকা | চকমনসুর বানীশ্রী সংঘ</title>

<link rel="icon" href="images/favicon.png">

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#fff8e8;
    color:#222;
}

/* Header */

.header{
    background:#7b1fa2;
    color:white;
    text-align:center;
    padding:18px 10px;
}

.header h1{
    margin:0;
    font-size:24px;
}

.header p{
    margin:6px 0 0;
    font-size:14px;
}

.home{
    display:inline-block;
    margin-top:12px;
    background:#ff9800;
    color:white;
    text-decoration:none;
    padding:8px 16px;
    border-radius:20px;
}


/* Calendar */

.calendar{
    width:95%;
    max-width:700px;
    margin:22px auto;
}

.month{
    background:white;
    padding:18px;
    text-align:center;
    border-radius:15px;
    box-shadow:0 3px 12px rgba(0,0,0,.15);
}

.month h2{
    margin:0;
    color:#c2185b;
    font-size:26px;
}

.month p{
    margin:6px 0 0;
    color:#666;
}


/* Week */

.week{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:4px;
    margin-top:15px;
}

.week div{
    background:#7b1fa2;
    color:white;
    text-align:center;
    padding:9px 2px;
    border-radius:5px;
    font-size:12px;
}


/* Days */

.days{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:4px;
    margin-top:5px;
}

.days div{
    background:white;
    min-height:55px;
    display:flex;
    justify-content:center;
    align-items:center;
    border-radius:6px;
    font-size:16px;
    font-weight:bold;
    box-shadow:0 1px 4px rgba(0,0,0,.08);
}


/* Important dates */

.special{
    background:#ffe082 !important;
    color:#b71c1c;
}


/* Footer */

.footer{
    margin-top:35px;
    background:#4a148c;
    color:white;
    text-align:center;
    padding:22px 10px;
}

.footer p{
    margin:5px;
    font-size:13px;
}


/* Mobile */

@media(max-width:500px){

    .header h1{
        font-size:21px;
    }

    .month h2{
        font-size:22px;
    }

    .week div{
        font-size:9px;
    }

    .days div{
        min-height:45px;
        font-size:13px;
    }

}

</style>

</head>

<body>


<header class="header">

    <h1>📅 বাংলা পঞ্জিকা</h1>

    <p>চকমনসুর বানীশ্রী সংঘ</p>

    <p>প্রতিষ্ঠিত - ১৯৬৫</p>

    <a href="index.html" class="home">🏠 হোম</a>

</header>


<main class="calendar">

    <div class="month">

        <h2>শ্রাবণ ১৪৩৩ বঙ্গাব্দ</h2>

        <p>বাংলা মাসের পঞ্জিকা</p>

    </div>


    <div class="week">

        <div>রবি</div>
        <div>সোম</div>
        <div>মঙ্গল</div>
        <div>বুধ</div>
        <div>বৃহস্পতি</div>
        <div>শুক্র</div>
        <div>শনি</div>

    </div>


    <div class="days">

        <div>১</div>
        <div>২</div>
        <div>৩</div>
        <div>৪</div>
        <div>৫</div>
        <div>৬</div>
        <div>৭</div>

        <div>৮</div>
        <div>৯</div>
        <div>১০</div>
        <div>১১</div>
        <div>১২</div>
        <div>১৩</div>
        <div>১৪</div>

        <div>১৫</div>
        <div>১৬</div>
        <div>১৭</div>
        <div>১৮</div>
        <div>১৯</div>
        <div>২০</div>
        <div>২১</div>

        <div>২২</div>
        <div>২৩</div>
        <div>২৪</div>
        <div>২৫</div>
        <div>২৬</div>
        <div>২৭</div>
        <div>২৮</div>

        <div>২৯</div>
        <div>৩০</div>

    </div>

</main>


<footer class="footer">

    <p>📅 বাংলা পঞ্জিকা</p>

    <p>চকমনসুর বানীশ্রী সংঘ</p>

    <p>© 2026 All Rights Reserved</p>

</footer>


</body>

</html>
