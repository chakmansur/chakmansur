<!DOCTYPE html>
<html lang="bn">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>বাংলা পঞ্জিকা</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#fff8e8;
    color:#222;
}

.header{
    background:#7b1fa2;
    color:white;
    text-align:center;
    padding:18px 10px;
}

.header h1{
    margin:0;
    font-size:25px;
}

.header p{
    margin:6px 0 0;
}

.calendar{
    width:95%;
    max-width:700px;
    margin:20px auto;
}

.month-bar{
    background:white;
    padding:15px;
    border-radius:15px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    box-shadow:0 3px 12px rgba(0,0,0,.15);
}

.month-bar button{
    width:42px;
    height:42px;
    border:0;
    border-radius:50%;
    background:#7b1fa2;
    color:white;
    font-size:20px;
}

.month-name{
    text-align:center;
}

.month-name h2{
    margin:0;
    color:#c2185b;
}

.month-name p{
    margin:5px 0 0;
    color:#666;
}

.today{
    background:#fff;
    margin-top:12px;
    padding:15px;
    text-align:center;
    border-radius:15px;
    box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.today h3{
    margin:0 0 8px;
    color:#7b1fa2;
}

.week{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:4px;
    margin-top:15px;
}

.week div{
    background:#7b1fa2;
    color:white;
    padding:9px 2px;
    text-align:center;
    border-radius:5px;
    font-size:12px;
}

.days{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:4px;
    margin-top:5px;
}

.days div{
    min-height:50px;
    background:white;
    display:flex;
    justify-content:center;
    align-items:center;
    border-radius:6px;
    font-weight:bold;
    box-shadow:0 1px 4px rgba(0,0,0,.08);
}

.days .today-date{
    background:#ff9800;
    color:white;
}

.footer{
    text-align:center;
    margin-top:30px;
    padding:20px;
    background:#4a148c;
    color:white;
}

@media(max-width:500px){

    .header h1{
        font-size:22px;
    }

    .month-name h2{
        font-size:21px;
    }

    .week div{
        font-size:10px;
    }

    .days div{
        min-height:43px;
        font-size:13px;
    }
}
</style>

</head>

<body>

<div class="header">

    <h1>📅 বাংলা পঞ্জিকা</h1>

    <p>চকমনসুর বানীশ্রী সংঘ</p>

</div>


<div class="calendar">

    <div class="month-bar">

        <button id="previous">◀</button>

        <div class="month-name">

            <h2 id="monthName">লোড হচ্ছে...</h2>

            <p id="yearName"></p>

        </div>

        <button id="next">▶</button>

    </div>


    <div class="today">

        <h3>আজকের বাংলা তারিখ</h3>

        <div id="todayDate">
            লোড হচ্ছে...
        </div>

    </div>


    <div class="week">

        <div>রবি</div>
        <div>সোম</div>
        <div>মঙ্গল</div>
        <div>বুধ</div>
        <div>বৃহস্পতি</div>
        <div>শুক্র</div>
        <div>শনি</div>

    </div>


    <div id="days" class="days"></div>

</div>


<div class="footer">

    <p>চকমনসুর বানীশ্রী সংঘ</p>

    <p>প্রতিষ্ঠিত - ১৯৬৫</p>

</div>


<script>

const months = [
    "বৈশাখ",
    "জ্যৈষ্ঠ",
    "আষাঢ়",
    "শ্রাবণ",
    "ভাদ্র",
    "আশ্বিন",
    "কার্তিক",
    "অগ্রহায়ণ",
    "পৌষ",
    "মাঘ",
    "ফাল্গুন",
    "চৈত্র"
];

const banglaDigits = [
    "০","১","২","৩","৪",
    "৫","৬","৭","৮","৯"
];

function bn(number){

    return String(number).replace(
        /\d/g,
        function(d){
            return banglaDigits[d];
        }
    );
}


/*
   আপাতত ১৪৩৩ বঙ্গাব্দ
   পরে আসল পঞ্জিকা data যুক্ত করব
*/

let month = 3;
let year = 1433;


function showCalendar(){

    document.getElementById("monthName")
        .innerText = months[month];

    document.getElementById("yearName")
        .innerText = bn(year) + " বঙ্গাব্দ";


    const days =
        document.getElementById("days");

    days.innerHTML = "";


    for(let i=1;i<=30;i++){

        const box =
            document.createElement("div");

        box.innerText = bn(i);

        days.appendChild(box);

    }

}


document.getElementById("previous")
.addEventListener("click",function(){

    month--;

    if(month < 0){

        month = 11;
        year--;

    }

    showCalendar();

});


document.getElementById("next")
.addEventListener("click",function(){

    month++;

    if(month > 11){

        month = 0;
        year++;

    }

    showCalendar();

});


showCalendar();

</script>

</body>

</html>
